<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tamanly Admin</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<script src="../gate.js"></script>
<meta name="theme-color" content="#3D2B6B">
<link rel="icon" href="../logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..600,0..1,0&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --color-indigo: #3D2B6B;
    --color-indigo-deep: #2A1D4D;
    --color-indigo-tint: #ECE9F3;
    --color-lav: #C9C1E0;
    --color-coral: #E87A6B;
    --color-coral-tint: #FBE6E2;
    --color-coral-ink: #A23F31;
    --color-sun: #E8B84A;
    --color-sun-tint: #FAF0D6;
    --color-sun-ink: #7A5A12;
    --color-cream: #F7F3EC;
    --color-paper: #FCFAF6;
    --color-ink: #1F1A2E;
    --color-muted: #6E6880;
    --color-line: #ECE6DC;
    --color-ok: #2E9E6B;
    --color-mint: #E3F3EC;
    --color-ok-ink: #1F7A50;
    --color-bad: #D64545;
    --color-bad-tint: #FBE4E4;
    --color-bad-ink: #B33232;
  }
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body class="bg-indigo font-sans text-ink antialiased">
<div id="app"></div>

<dialog id="drawer" class="drawer" aria-labelledby="dr-title">
  <div class="dr-head on-dark">
    <div class="min-w-0 flex-1">
      <h2 id="dr-title" class="text-[20px] leading-7 font-semibold tracking-[-0.01em]"></h2>
      <p id="dr-sub" class="mt-0.5 text-[13.5px] text-lav"></p>
    </div>
    <button type="button" class="btn btn-icon btn-dark dr-close" data-act="drawer-close" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button>
  </div>
  <div class="dr-body" id="dr-body"></div>
  <div class="dr-foot" id="dr-foot"></div>
</dialog>

<dialog id="palette" class="palette" aria-label="Go to page or record">
  <div class="flex items-center gap-3 px-4 h-14 border-b border-line">
    <span class="ms text-muted" aria-hidden="true">search</span>
    <input id="pal-q" class="flex-1 h-full bg-transparent text-[16px] outline-none placeholder:text-muted" placeholder="Go to a page, unit, person, permit or invoice" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list" autocomplete="off">
    <kbd class="text-[11.5px] font-semibold text-muted bg-cream rounded-lg px-2 py-1">Esc</kbd>
  </div>
  <div id="pal-list" role="listbox" class="max-h-[60vh] overflow-y-auto p-2"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="helpers.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
<script src="pages2.js"></script>
</body>
</html>
