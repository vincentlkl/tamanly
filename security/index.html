<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tamanly Guard</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<script src="../gate.js"></script>
<meta name="theme-color" content="#3D2B6B">
<link rel="icon" href="../logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..600,0..1,0&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --color-indigo: #3D2B6B;
    --color-indigo-deep: #2A1D4D;
    --color-indigo-tint: #ECE9F3;
    --color-lav: #C9C1E0;
    --color-coral: #E87A6B;
    --color-coral-tint: #FBE6E2;
    --color-coral-ink: #A23F31;
    --color-sun: #E8B84A;
    --color-sun-tint: #FAF0D6;
    --color-sun-ink: #7A5A12;
    --color-cream: #F7F3EC;
    --color-paper: #FCFAF6;
    --color-ink: #1F1A2E;
    --color-muted: #6E6880;
    --color-line: #ECE6DC;
    --color-ok: #2E9E6B;
    --color-mint: #E3F3EC;
    --color-ok-ink: #1F7A50;
    --color-bad: #D64545;
    --color-bad-tint: #FBE4E4;
    --color-bad-ink: #B33232;
  }
</style>
<link rel="stylesheet" href="../admin/ui.css">
<style>
  /* Guard console only. Shared tokens and components come from admin/ui.css. */
  @layer components {
    .rail-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 76px; min-height: 64px; border-radius: 18px; color: var(--lav); font-size: 12px; font-weight: 500; text-decoration: none; transition: background-color .15s, color .15s; }
    .rail-item:hover { background: rgba(255, 255, 255, .08); color: #fff; }
    .rail-item[aria-current="page"] { background: var(--cream); color: var(--indigo); font-weight: 600; }
    .rail-item .ms { font-size: 24px; }
    .fab { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--coral); color: var(--indigo-deep); box-shadow: 0 6px 16px rgba(20, 12, 40, .28); }
    .fab .ms { font-size: 28px; }
    .bbar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 30; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; height: 70px; padding: 0 4px 8px; border-radius: 24px; background: #fff; box-shadow: 0 10px 30px rgba(31, 26, 46, .16); }
    .bar-item { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 500; color: var(--muted); text-decoration: none; }
    .bar-item .ms { font-size: 24px; }
    .bar-item[aria-current="page"] { color: var(--indigo); font-weight: 600; }
    .bar-item .fab { margin-top: -30px; box-shadow: 0 6px 16px rgba(20, 12, 40, .22), 0 0 0 5px #fff; }

    .btn-xl { height: 56px; padding: 0 24px; font-size: 16px; }
    .btn-xl .ms { font-size: 22px; }
    .btn-ok { background: var(--ok-ink); color: #fff; }
    .btn-ok:hover:not(:disabled) { background: #186543; }
    .choice { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; padding: 8px; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 1px var(--edge); color: var(--ink); font-size: 13.5px; font-weight: 600; line-height: 1.2; text-align: center; cursor: pointer; transition: box-shadow .15s, background-color .15s; }
    .choice:hover { box-shadow: inset 0 0 0 1px #CFC6B6; }
    .choice .ms { font-size: 22px; }
    .choice[aria-pressed="true"], .choice:has(input:checked) { background: var(--indigo-tint); color: var(--indigo); box-shadow: inset 0 0 0 2px var(--indigo); }
    .choice.row { flex-direction: row; min-height: 48px; padding: 0 16px; border-radius: 999px; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice:has(input:focus-visible) { outline: 2px solid var(--indigo); outline-offset: 2px; }
    @media (max-width: 1023px) { #toast { bottom: calc(96px + env(safe-area-inset-bottom)); } }
    .stepper { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: #fff; box-shadow: inset 0 0 0 1px var(--edge); color: var(--indigo); font-size: 24px; font-weight: 600; }
    .stepper:disabled { opacity: .35; cursor: not-allowed; }
    .key { height: 64px; border-radius: 18px; display: grid; place-items: center; background: #fff; box-shadow: inset 0 0 0 1px var(--edge); color: var(--ink); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; transition: background-color .1s; }
    .key:active { background: var(--indigo-tint); }
    .key .ms { font-size: 26px; }
    .dots { display: flex; gap: 14px; }
    .dots span { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--indigo); transition: background-color .15s; }
    .dots span.on { background: var(--indigo); }
    .spin { display: inline-block; width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }

    .sheet { margin: auto; padding: 0; border: 0; width: min(600px, calc(100vw - 32px)); max-width: none; max-height: calc(100dvh - 32px); border-radius: 28px; background: #fff; color: var(--ink); box-shadow: 0 24px 64px rgba(31, 26, 46, .35); overflow: hidden; display: none; flex-direction: column; }
    .sheet[open] { display: flex; animation: fadeUp .2s var(--ease); }
    .sheet::backdrop { background: rgba(31, 26, 46, .55); }
    @media (max-width: 640px) {
      .sheet { margin: auto 0 0; width: 100vw; max-height: 94dvh; border-radius: 28px 28px 0 0; }
      .sheet[open] { animation-name: drUp; }
    }
    .band { display: flex; align-items: flex-start; gap: 16px; padding: 22px 16px 22px 24px; flex: none; }
    .band-ok { background: var(--ok-ink); color: #fff; }
    .band-bad { background: var(--bad-ink); color: #fff; }
    .band-sun { background: var(--sun); color: var(--ink); }
    .band-neutral { background: var(--indigo); color: #fff; }
    .band .big { font-size: 44px; width: 44px; }
    @media (min-width: 640px) { .band { padding-top: 26px; padding-bottom: 26px; } .band .big { font-size: 52px; width: 52px; } .sheet { width: min(640px, calc(100vw - 32px)); } }
    /* The one authored motion: the verdict colour wipes in, so the answer lands before the details */
    .sheet[open] .band.enter { animation: verdict .34s var(--ease) both; } /* first open only, not on every redraw */
    @keyframes verdict { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
    .sh-close { width: 48px; height: 48px; margin-left: auto; border-radius: 50%; display: grid; place-items: center; flex: none; color: inherit; }
    .sh-close:hover { background: rgba(255, 255, 255, .16); }
    .band-sun .sh-close:hover { background: rgba(31, 26, 46, .08); }
    .sh-body { flex: 1; overflow-y: auto; padding: 20px 24px 24px; }
    .sh-foot { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 24px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #fff; flex: none; }
    .sh-foot > * { flex: 1 1 160px; }
    @media (max-width: 640px) { .sh-body { padding: 18px 16px 22px; } .sh-foot { padding-left: 16px; padding-right: 16px; } .band { padding-left: 18px; } }

    .viewfinder { position: relative; aspect-ratio: 16 / 10; border-radius: 20px; background: #1F1A2E; overflow: hidden; display: grid; place-items: center; color: var(--lav); }
    .viewfinder::before { content: ""; position: absolute; inset: 14% 30%; border-radius: 18px; border: 3px solid rgba(255, 255, 255, .85); }
    .viewfinder::after { content: ""; position: absolute; left: 31%; right: 31%; top: 16%; height: 2px; background: var(--coral); animation: scanline 2.2s ease-in-out infinite alternate; }
    @keyframes scanline { to { top: 84%; } }
    @media (prefers-reduced-motion: reduce) { .viewfinder::after { animation: none; top: 50%; } }
  }
</style>
</head>
<body class="bg-indigo font-sans text-ink antialiased">
<div id="app"></div>
<dialog id="sheet" class="sheet" aria-labelledby="sh-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="../admin/data.js"></script>
<script src="../admin/helpers.js"></script>
<script src="guard.js"></script>
</body>
</html>
